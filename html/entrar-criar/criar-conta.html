<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style/entrar-criar/criar-conta.css">
    <link rel="shortcut icon" href="../../assets/favicon/favicon.ico" type="image/x-icon">
    <title>PetVibe - Criar conta</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <img class="logo" src="../../assets/img/logo-petvibe.png" alt="Logo do Site" title="Logo PetVibe">
        </nav>
    </header>

    <main>
        <div class="progresso">
            <p class="text-passos">Passo 1 de 2 · Seus dados</p>
            <div class="barra-progresso">
                <div class="step active"></div>
                <div class="step"></div>
            </div>
        </div>

        <div class="title">
            <h1 class="titulo-principal">Criar conta</h1>
            <p class="subtitutulo">Campos com * são obrigatórios</p>
        </div>

        <section class="dados-pessoais">
            <h2 class="titulo-dp">1. Dados pessoais</h2>
            <form class="bg-bege">
                <div class="campo">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" placeholder="" required >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 90000-0000" inputmode="numeric" maxlength="15" required >
                </div>

                <div class="campo">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required >
                </div>

                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required >
                </div>
            </form>
        </section>

        <section class="dados-endereco">
            <h2 class="titulo-de">2. Endereço</h2>
            <form class="bg-bege">
                <div class="campo">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" inputmode="numeric" autocomplete="postal-code" required >
                </div>

                <div class="campo">
                    <label for="rua">Endereço *</label>
                    <input type="text" id="rua" name="rua" placeholder="Rua, avenida..." autocomplete="street-address" required >
                </div>

                <div class="campo-n">
                    <label for="numero">Nº *</label>
                    <input type="text" id="numero" name="numero" placeholder="123" inputmode="numeric" required >
                </div>
                
                <div class="campo-complemento">
                    <label for="comple">Complemeto *</label>
                    <input type="text" name="comple" id="comple" placeholder="Apto, bloco..." required >
                </div>

                <div class="campo">
                    <label for="bairro">Bairro *</label>
                    <input type="text" name="bairro" id="bairro" required >
                </div>

                <div class="campo-cidade">
                    <label for="cidade">Cidade *</label>
                    <input type="text" name="cidade" id="cidade" placeholder="Ex: São Paulo" required >
                </div>

                <div class="campo-estado">
                    <label for="estado">Estado *</label>
                    <select name="estado" id="estado" >
                        <option value=""></option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AM">AM</option>
                        <option value="AP">AP</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MG">MG</option>
                        <option value="MS">MS</option>
                        <option value="MT">MT</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="PR">PR</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="RS">RS</option>
                        <option value="SC">SC</option>
                        <option value="SE">SE</option>
                        <option value="SP">SP</option>
                        <option value="TO">TO</option>
                    </select>
                </div>
                
            </form>
        </section>

        <section class="Criar senha">
            <h2 class="titulo-s">3. Criar senha</h2>
            <form class="bg-bege">
                <div class="campo">
                    <label for="senha">Senha *</label>
                    <input type="password" id="senha" name="senha" minlength="8" required >
                    <p class="p-senha">Mínimo de 8 caracteres, com letras e números.</p>
                </div>

                <div class="campo">
                    <label for="senha-confirm">Confirmar senha *</label>
                    <input type="password" name="senha-confirm" id="senha-confirm" minlength="8" required>
                </div>
            </form>

        </section>

        <section class="sec-btn">
            <button class="btn">Continuar</button>
            <p class="">Já tem uma conta ?<a href="../entrar-criar/login.html">Entrar</a></p>
        </section>
    </main>

</body>
</html>
